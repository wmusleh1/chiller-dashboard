<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PepsiCo Chiller Plant Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0b1220;
    --panel:#121b2e;
    --panel-2:#0f1729;
    --border:#22304a;
    --text:#e8edf7;
    --muted:#8b98b5;
    --accent:#3ea6ff;
    --accent-2:#7c5cff;
    --green:#22c55e;
    --green-bg:rgba(34,197,94,0.12);
    --red:#ef4444;
    --red-bg:rgba(239,68,68,0.14);
    --yellow:#f5b83d;
    --yellow-bg:rgba(245,184,61,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:
      radial-gradient(1200px 500px at 10% -10%, rgba(62,166,255,0.10), transparent),
      radial-gradient(1000px 500px at 100% 0%, rgba(124,92,255,0.10), transparent),
      var(--bg);
    color:var(--text);
    min-height:100vh;
  }
  .wrap{max-width:1280px;margin:0 auto;padding:28px 20px 60px;}

  header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px;margin-bottom:24px;}
  header h1{margin:0 0 6px;font-size:26px;letter-spacing:0.2px;}
  header .sub{color:var(--muted);font-size:14px;}
  .updated{
    text-align:right;font-size:13px;color:var(--muted);
    background:var(--panel);border:1px solid var(--border);
    padding:10px 14px;border-radius:10px;
  }
  .updated span{color:var(--text);font-weight:600;}

  .fleet-summary{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:14px;margin-bottom:26px;
  }
  .stat-card{
    background:var(--panel);border:1px solid var(--border);
    border-radius:14px;padding:16px 18px;
  }
  .stat-card .label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:0.6px;margin-bottom:6px;}
  .stat-card .value{font-size:26px;font-weight:700;}
  .stat-card .value.green{color:var(--green);}
  .stat-card .value.red{color:var(--red);}
  .stat-card .value.yellow{color:var(--yellow);}

  .grid{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:18px;margin-bottom:30px;
  }

  .card{
    background:linear-gradient(180deg,var(--panel),var(--panel-2));
    border:1px solid var(--border);border-radius:16px;
    padding:20px;position:relative;overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
  }
  .card-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
  .card-head h2{margin:0;font-size:18px;}
  .card-head .meta{color:var(--muted);font-size:12.5px;margin-top:4px;line-height:1.5;}

  .badge{
    display:inline-flex;align-items:center;gap:6px;
    font-size:12px;font-weight:700;letter-spacing:0.3px;
    padding:6px 12px;border-radius:999px;white-space:nowrap;
  }
  .badge.green{background:var(--green-bg);color:var(--green);}
  .badge.red{background:var(--red-bg);color:var(--red);}
  .badge.yellow{background:var(--yellow-bg);color:var(--yellow);}
  .dot{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor;}

  .circuits{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 16px;}
  .circuit{
    flex:1;min-width:54px;text-align:center;padding:10px 6px;border-radius:10px;
    font-size:11px;font-weight:700;border:1px solid transparent;
  }
  .circuit .n{display:block;font-size:14px;margin-bottom:2px;}
  .circuit.green{background:var(--green-bg);color:var(--green);border-color:rgba(34,197,94,0.3);}
  .circuit.red{background:var(--red-bg);color:var(--red);border-color:rgba(239,68,68,0.3);}
  .circuit.yellow{background:var(--yellow-bg);color:var(--yellow);border-color:rgba(245,184,61,0.3);}

  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .kpi{background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:10px;padding:9px 11px;}
  .kpi .l{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:0.4px;}
  .kpi .v{font-size:15px;font-weight:700;margin-top:2px;}

  .events{border-top:1px dashed var(--border);padding-top:12px;font-size:12.5px;}
  .events .row{display:flex;justify-content:space-between;gap:8px;padding:4px 0;color:var(--muted);}
  .events .row b{color:var(--text);font-weight:600;}
  .events .fail-desc{color:var(--text);font-size:12px;margin-top:2px;}

  .charts{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  .chart-card{
    background:var(--panel);border:1px solid var(--border);border-radius:16px;
    padding:18px 18px 8px;
  }
  .chart-card h3{margin:0 0 12px;font-size:15px;color:var(--text);}
  .legend{display:flex;gap:18px;margin-top:18px;color:var(--muted);font-size:12.5px;flex-wrap:wrap;}
  .legend .item{display:flex;align-items:center;gap:6px;}
  .legend .sw{width:10px;height:10px;border-radius:3px;}

  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:34px;}

  @media (max-width:640px){
    .charts{grid-template-columns:1fr;}
    .kpis{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>❄️ Chiller Plant Dashboard</h1>
      <div class="sub" id="plantName">PepsiCo Plant — Chiller Fleet</div>
    </div>
    <div class="updated">Last updated<br><span id="lastUpdated">—</span></div>
  </header>

  <div class="fleet-summary" id="fleetSummary"></div>

  <div class="grid" id="chillerGrid"></div>

  <div class="charts">
    <div class="chart-card">
      <h3>Uptime % by Chiller</h3>
      <canvas id="uptimeChart" height="200"></canvas>
    </div>
    <div class="chart-card">
      <h3>MTBF (hrs) vs MTTR (hrs) by Chiller</h3>
      <canvas id="mtbfChart" height="200"></canvas>
    </div>
  </div>

  <div class="legend">
    <div class="item"><span class="sw" style="background:var(--green)"></span> Running / OK</div>
    <div class="item"><span class="sw" style="background:var(--yellow)"></span> Under repair</div>
    <div class="item"><span class="sw" style="background:var(--red)"></span> Down / broken</div>
  </div>

  <footer>Data is manually maintained in data.js — edit that file to update status, KPIs and events.</footer>
</div>

<script src="data.js"></script>
<script>
const STATUS_META = {
  running: { label: "RUNNING", color: "green" },
  down:    { label: "DOWN",    color: "red" },
  repair:  { label: "REPAIR",  color: "yellow" }
};

function overallStatus(circuits){
  if(circuits.some(c => c.status === "down"))   return { label: "FAULT",        color: "red" };
  if(circuits.some(c => c.status === "repair")) return { label: "UNDER REPAIR", color: "yellow" };
  return { label: "RUNNING", color: "green" };
}

function fmtDate(d){
  if(!d || d.toUpperCase?.() === "TBD" || d.startsWith("TBD")) return d;
  const dt = new Date(d + "T00:00:00");
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString("en-GB",{ day:"2-digit", month:"short", year:"numeric" });
}

function daysAgo(d){
  const dt = new Date(d + "T00:00:00");
  if(isNaN(dt)) return null;
  const diff = Math.floor((Date.now() - dt.getTime()) / 86400000);
  return diff;
}

function render(){
  document.getElementById("plantName").textContent = chillerData.plantName;
  document.getElementById("lastUpdated").textContent = chillerData.lastUpdated;

  const chillers = chillerData.chillers;

  // ---- Fleet summary ----
  const totalCircuits = chillers.reduce((s,c)=>s+c.circuits.length,0);
  const downCircuits = chillers.reduce((s,c)=>s+c.circuits.filter(x=>x.status==="down").length,0);
  const repairCircuits = chillers.reduce((s,c)=>s+c.circuits.filter(x=>x.status==="repair").length,0);
  const avgUptime = (chillers.reduce((s,c)=>s+c.uptimePercent,0)/chillers.length).toFixed(1);
  const avgMTBF = Math.round(chillers.reduce((s,c)=>s+c.mtbfHours,0)/chillers.length);
  const unitsRunning = chillers.filter(c=>overallStatus(c.circuits).color==="green").length;

  const summary = document.getElementById("fleetSummary");
  summary.innerHTML = `
    <div class="stat-card"><div class="label">Chillers Fully Running</div><div class="value green">${unitsRunning} / ${chillers.length}</div></div>
    <div class="stat-card"><div class="label">Fleet Avg Uptime</div><div class="value">${avgUptime}%</div></div>
    <div class="stat-card"><div class="label">Circuits Down</div><div class="value ${downCircuits>0?'red':'green'}">${downCircuits} / ${totalCircuits}</div></div>
    <div class="stat-card"><div class="label">Circuits Under Repair</div><div class="value ${repairCircuits>0?'yellow':'green'}">${repairCircuits} / ${totalCircuits}</div></div>
    <div class="stat-card"><div class="label">Fleet Avg MTBF</div><div class="value">${avgMTBF} h</div></div>
  `;

  // ---- Chiller cards ----
  const grid = document.getElementById("chillerGrid");
  grid.innerHTML = chillers.map(c => {
    const st = overallStatus(c.circuits);
    const lastFailDays = daysAgo(c.lastFailure.date);
    return `
    <div class="card">
      <div class="card-head">
        <div>
          <h2>${c.name}</h2>
          <div class="meta">${c.model} &middot; S/N: ${c.serialNumber}<br>${c.location}</div>
        </div>
        <span class="badge ${st.color}"><span class="dot"></span>${st.label}</span>
      </div>

      <div class="circuits">
        ${c.circuits.map(cir => `
          <div class="circuit ${STATUS_META[cir.status].color}">
            <span class="n">C${cir.id}</span>${STATUS_META[cir.status].label}
          </div>`).join("")}
      </div>

      <div class="kpis">
        <div class="kpi"><div class="l">Uptime</div><div class="v">${c.uptimePercent}%</div></div>
        <div class="kpi"><div class="l">MTBF</div><div class="v">${c.mtbfHours} h</div></div>
        <div class="kpi"><div class="l">MTTR</div><div class="v">${c.mttrHours} h</div></div>
        <div class="kpi"><div class="l">Runtime</div><div class="v">${c.runtimeHours.toLocaleString()} h</div></div>
        <div class="kpi"><div class="l">Current Load</div><div class="v">${c.currentLoadPercent}%</div></div>
        <div class="kpi"><div class="l">Supply / Return</div><div class="v">${c.supplyTempC}°C / ${c.returnTempC}°C</div></div>
      </div>

      <div class="events">
        <div class="row"><span>Last failure${lastFailDays!==null?` (${lastFailDays}d ago)`:""}</span><b>${fmtDate(c.lastFailure.date)}</b></div>
        <div class="fail-desc">${c.lastFailure.description}</div>
        <div class="row" style="margin-top:8px;"><span>Last maintenance — ${c.lastMaintenance.type}</span><b>${fmtDate(c.lastMaintenance.date)}</b></div>
        <div class="row"><span>Next maintenance due</span><b>${fmtDate(c.nextMaintenanceDue)}</b></div>
      </div>
    </div>`;
  }).join("");

  // ---- Charts ----
  const labels = chillers.map(c=>c.name.replace(" Chiller",""));
  const gridColor = "rgba(255,255,255,0.06)";
  const textColor = "#8b98b5";

  new Chart(document.getElementById("uptimeChart"), {
    type: "bar",
    data: {
      labels,
      datasets: [{
        label: "Uptime %",
        data: chillers.map(c=>c.uptimePercent),
        backgroundColor: chillers.map(c => {
          const s = overallStatus(c.circuits).color;
          return s==="green" ? "#22c55e" : s==="yellow" ? "#f5b83d" : "#ef4444";
        }),
        borderRadius: 8,
        maxBarThickness: 48
      }]
    },
    options: {
      responsive:true,
      plugins:{ legend:{ display:false } },
      scales:{
        y:{ beginAtZero:true, max:100, ticks:{color:textColor}, grid:{color:gridColor} },
        x:{ ticks:{color:textColor}, grid:{display:false} }
      }
    }
  });

  new Chart(document.getElementById("mtbfChart"), {
    type: "bar",
    data: {
      labels,
      datasets: [
        { label:"MTBF (h)", data: chillers.map(c=>c.mtbfHours), backgroundColor:"#3ea6ff", borderRadius:8, maxBarThickness:36 },
        { label:"MTTR (h)", data: chillers.map(c=>c.mttrHours), backgroundColor:"#7c5cff", borderRadius:8, maxBarThickness:36 }
      ]
    },
    options: {
      responsive:true,
      plugins:{ legend:{ labels:{color:textColor} } },
      scales:{
        y:{ beginAtZero:true, ticks:{color:textColor}, grid:{color:gridColor} },
        x:{ ticks:{color:textColor}, grid:{display:false} }
      }
    }
  });
}

render();
</script>
</body>
</html>
